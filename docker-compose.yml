services:
  db:
    image: postgres:16-alpine
    container_name: recruit-db
    environment:
      POSTGRES_USER: recruit_admin
      POSTGRES_PASSWORD: recruit_admin_dev
      POSTGRES_DB: recruit
    ports:
      - "5434:5432"
    volumes:
      - recruit-pg:/var/lib/postgresql/data
      - ./docker/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruit_admin -d recruit"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  recruit-pg:
