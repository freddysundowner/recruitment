# Production, and single-agency installs. Copy .env.prod.example to .env.prod, fill it in, then follow INSTALL.md.
# The same file runs the shared (SaaS) service and a single-agency install: the difference is TENANT_MODE.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: recruit_admin
      POSTGRES_PASSWORD: ${ADMIN_DB_PASSWORD:?set ADMIN_DB_PASSWORD}
      POSTGRES_DB: recruit
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruit_admin -d recruit"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., target: migrate }
    profiles: ["tools"]
    depends_on: { db: { condition: service_healthy } }
    environment:
      MIGRATE_DATABASE_URL: postgres://recruit_admin:${ADMIN_DB_PASSWORD}@db:5432/recruit
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY}
      SESSION_SECRET: ${SESSION_SECRET}

  app:
    build: { context: ., target: run }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file: .env.prod
    environment:
      DATABASE_URL: postgres://recruit_app:${APP_DB_PASSWORD}@db:5432/recruit
      STORAGE_DIR: /data/storage
    volumes:
      - documents:/data/storage

  worker:
    build: { context: ., target: worker }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    env_file: .env.prod
    environment:
      # The worker works across agencies, so it uses the owner account. It never faces the internet.
      WORKER_DATABASE_URL: postgres://recruit_admin:${ADMIN_DB_PASSWORD}@db:5432/recruit
      STORAGE_DIR: /data/storage
    volumes:
      - documents:/data/storage

  # Optional: store documents in your own S3-compatible storage instead of a folder. Set STORAGE_DRIVER=s3 and
  # S3_ENDPOINT=http://minio:9000, S3_FORCE_PATH_STYLE=true, then: docker compose --profile minio up -d
  minio:
    image: minio/minio
    profiles: ["minio"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-change-me-too}
    volumes: [miniodata:/data]

  # Optional: virus scanning of uploaded documents. Set CLAMAV_HOST=clamav, then: docker compose --profile clamav up -d
  clamav:
    image: clamav/clamav:stable
    profiles: ["clamav"]
    restart: unless-stopped

volumes:
  pgdata:
  documents:
  miniodata:
